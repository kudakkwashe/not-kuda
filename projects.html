<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup Screen Overlay</title>
  <style>
    /* Reset and layout base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Background image container preserving aspect ratio */
    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fixed aspect ratio wrapper matching a standard 16:9 image */
    .screen-wrapper {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    /* Background image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    /* Overlay containers placed over each monitor screen */
    .screen-overlay {
      position: absolute;
      z-index: 2;
      color: #00ffcc; /* Terminal/Screen glow color */
      font-family: monospace;
      padding: 1rem;
      overflow-y: auto;
      border-radius: 4px;
      /* Subtle dark background to improve contrast if needed */
      background: rgba(0, 0, 0, 0.4); 
    }

    /* Custom scrollbars for screen overlays */
    .screen-overlay::-webkit-scrollbar {
      width: 4px;
    }
    .screen-overlay::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 204, 0.3);
      border-radius: 2px;
    }

    /* Exact coordinate percentages mapped to image bounds */
    
    /* Left Desktop Monitor */
    .screen-left {
      top: 7.5%;
      left: 9.3%;
      width: 40.2%;
      height: 41.5%;
    }

    /* Right Desktop Monitor */
    .screen-right {
      top: 7.5%;
      left: 49.6%;
      width: 40.2%;
      height: 41.5%;
    }

    /* Laptop Screen */
    .screen-laptop {
      top: 52.8%;
      left: 38.0%;
      width: 23.2%;
      height: 27.8%;
      color: #ffffff;
      font-size: 0.85rem;
    }

    /* Content styling inside overlays */
    .screen-overlay h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid rgba(0, 255, 204, 0.3);
      padding-bottom: 0.25rem;
    }

    .screen-overlay p {
      font-size: 0.9rem;
      line-height: 1.4;
      margin-bottom: 0.5rem;
    }

    .terminal-line {
      display: block;
      margin-bottom: 0.2rem;
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    <div class="screen-wrapper">
      <!-- Background Image (Ensure file path matches wallpaper location) -->
      <img src="wallpaper2.jpg" alt="Workspace Setup" class="bg-image">

      <!-- Left Monitor Overlay -->
      <div class="screen-overlay screen-left" id="screenLeft">
        <h2>LEFT MONITOR</h2>
        <p>Main Workspace / IDE</p>
        <span class="terminal-line">> System initialized...</span>
        <span class="terminal-line">> Loading components...</span>
        <span class="terminal-line">> Status: 200 OK</span>
      </div>

      <!-- Right Monitor Overlay -->
      <div class="screen-overlay screen-right" id="screenRight">
        <h2>RIGHT MONITOR</h2>
        <p>Documentation / Metrics</p>
        <span class="terminal-line">[1] CPU: 12% | RAM: 42%</span>
        <span class="terminal-line">[2] Active Connections: 8</span>
      </div>

      <!-- Laptop Screen Overlay -->
      <div class="screen-overlay screen-laptop" id="screenLaptop">
        <p>Laptop Screen</p>
        <span class="terminal-line">$ git status</span>
        <span class="terminal-line">On branch main</span>
      </div>
    </div>
  </div>

  <script>
    // Example JavaScript: Dynamically update text or stream content to screens
    document.addEventListener("DOMContentLoaded", () => {
      const laptopScreen = document.getElementById("screenLaptop");
      
      // Dynamic clock element for the laptop screen
      const clockElement = document.createElement("div");
      clockElement.style.marginTop = "10px";
      clockElement.style.fontWeight = "bold";
      laptopScreen.appendChild(clockElement);

      function updateClock() {
        const now = new Date();
        clockElement.textContent = "Time: " + now.toLocaleTimeString();
      }

      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>
</body>
</html>
