<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work In Progress</title>
    <!-- Import Space Mono for authentic code typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0f;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Responsive Setup Container preserving aspect ratio */
        .stage {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            aspect-ratio: 1000 / 815;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Base desk photograph */
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Left Monitor Overlay: JSS / Theme Code */
        .overlay-left-screen {
            position: absolute;
            top: 25%;
            left: 9.3%;
            width: 40.8%;
            height: 29.2%;
            background-color: #0b0c10;
            color: #4ade80;
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.45rem, 0.8vw, 0.75rem);
            padding: 3% 4%;
            overflow: hidden;
            line-height: 1.45;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .code-keyword { color: #f472b6; }
        .code-prop { color: #38bdf8; }
        .code-string { color: #facc15; }
        .code-comment { color: #64748b; font-style: italic; }

        /* Right Monitor Overlay: Image Frame Container */
        .overlay-right-screen {
            position: absolute;
            top: 25%;
            left: 50.3%;
            width: 40.8%;
            height: 29.2%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .overlay-right-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-note {
            color: #475569;
            font-size: clamp(0.5rem, 0.9vw, 0.8rem);
            font-family: 'Space Mono', monospace;
            text-align: center;
            padding: 10px;
        }

        /* Laptop Display Overlay: Text Message */
        .overlay-laptop-screen {
            position: absolute;
            top: 58.8%;
            left: 38.6%;
            width: 23.3%;
            height: 20.3%;
            background-color: #050505;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4%;
            text-align: center;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
        }

        .laptop-text {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.5rem, 0.85vw, 0.8rem);
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.01em;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- Main Desk Scene Image -->
        <img src="wallpaper2.jpg" alt="Desk Setup" class="bg-image">

        <!-- 1. LEFT MONITOR: JSS Code for Web Colors -->
        <div class="overlay-left-screen">
            <span class="code-comment">// System Theme Colors</span><br>
            <span class="code-keyword">const</span> styles = {<br>
            &nbsp;&nbsp;<span class="code-prop">theme</span>: {<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">background</span>: <span class="code-string">'#0d0d11'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">surface</span>: <span class="code-string">'#18181f'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">primary</span>: <span class="code-string">'#ff3300'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">textMain</span>: <span class="code-string">'#f8fafc'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">textMuted</span>: <span class="code-string">'#64748b'</span><br>
            &nbsp;&nbsp;}<br>
            };
        </div>

        <!-- 2. RIGHT MONITOR: Blacked out image frame with custom src -->
        <div class="overlay-right-screen">
            <!-- Replace 'your-image.jpg' with your picture path -->
            <img src="your-image.jpg" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="placeholder-note" style="display: none;">
                [ INSERT YOUR IMAGE HERE ]<br>src="your-image.jpg"
            </div>
        </div>

        <!-- 3. LAPTOP SCREEN: Personal Statement -->
        <div class="overlay-laptop-screen">
            <div class="laptop-text">
                i am working on this page, its harder than i thought XD
            </div>
        </div>
    </div>

</body>
</html>
