<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup Screen Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Outer wrapper constraining to screen bounds */
    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Screen wrapper matches image natural boundaries directly */
    .screen-wrapper {
      position: relative;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      /* Ensures container matches image dimensions exactly */
      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));
      container-type: inline-size;
    }

    /* Image spans entire wrapper without black bars inside wrapper */
    .bg-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* Base overlay positioning */
    .screen-overlay {
      position: absolute;
      z-index: 2;
      color: #00ffcc;
      font-family: monospace;
      padding: 1cqw;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
    }

    /* Screen coordinates */
    .screen-left {
      top: 7.5%;
      left: 9.3%;
      width: 40.2%;
      height: 41.5%;
    }

    .screen-right {
      top: 7.5%;
      left: 49.6%;
      width: 40.2%;
      height: 41.5%;
    }

    .screen-laptop {
      top: 52.8%;
      left: 38.0%;
      width: 23.2%;
      height: 27.8%;
      color: #ffffff;
    }

    /* Fluid typography that works across desktop and mobile */
    .screen-overlay h2 {
      font-size: clamp(10px, 1.8cqw, 24px);
      margin-bottom: 0.3cqw;
      border-bottom: 1px solid rgba(0, 255, 204, 0.3);
      padding-bottom: 0.1cqw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .screen-overlay p, 
    .terminal-line {
      font-size: clamp(8px, 1.1cqw, 15px);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .screen-laptop p,
    .screen-laptop .terminal-line {
      font-size: clamp(7px, 0.85cqw, 12px);
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    <div class="screen-wrapper">
      <!-- Background Image -->
      <img src="wallpaper2.jpg" alt="Workspace Setup" class="bg-image">

      <!-- Left Monitor Overlay -->
      <div class="screen-overlay screen-left" id="screenLeft">
        <h2>LEFT MONITOR</h2>
        <p>Main Workspace</p>
        <span class="terminal-line">> System initialized...</span>
        <span class="terminal-line">> Status: 200 OK</span>
      </div>

      <!-- Right Monitor Overlay -->
      <div class="screen-overlay screen-right" id="screenRight">
        <h2>RIGHT MONITOR</h2>
        <p>Documentation</p>
        <span class="terminal-line">[1] CPU: 12% | RAM: 42%</span>
        <span class="terminal-line">[2] Active Connections: 8</span>
      </div>

      <!-- Laptop Screen Overlay -->
      <div class="screen-overlay screen-laptop" id="screenLaptop">
        <p>Laptop Screen</p>
        <span class="terminal-line">$ git status</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const laptopScreen = document.getElementById("screenLaptop");
      
      const clockElement = document.createElement("div");
      clockElement.className = "terminal-line";
      clockElement.style.marginTop = "0.4cqw";
      clockElement.style.fontWeight = "bold";
      laptopScreen.appendChild(clockElement);

      function updateClock() {
        const now = new Date();
        clockElement.textContent = "Time: " + now.toLocaleTimeString();
      }

      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>
</body>
</html>
