<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work In Progress</title>
    <!-- Space Mono font for the code and laptop text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #050507;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 16:9 Responsive Desk Stage */
        .stage {
            position: relative;
            width: 100vw;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            max-height: 100vh;
            margin: auto;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 1. LEFT MONITOR: Code Overlay */
        .overlay-left-screen {
            position: absolute;
            top: 7.7%;
            left: 9.6%;
            width: 40.0%;
            height: 38.6%;
            background-color: #0b0c10;
            color: #4ade80;
            font-family: 'Space Mono', monospace;
            /* Fluid typography scales with viewport width */
            font-size: clamp(0.35rem, 0.85vw, 0.9rem);
            padding: 2% 3%;
            overflow: hidden;
            line-height: 1.4;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
            border-radius: 2px;
        }

        .code-keyword { color: #f472b6; }
        .code-prop { color: #38bdf8; }
        .code-string { color: #facc15; }
        .code-comment { color: #64748b; font-style: italic; }

        /* 2. RIGHT MONITOR: Custom Image Frame Overlay */
        .overlay-right-screen {
            position: absolute;
            top: 7.7%;
            left: 50.1%;
            width: 40.0%;
            height: 38.6%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
            border-radius: 2px;
        }

        .overlay-right-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-note {
            color: #475569;
            font-size: clamp(0.4rem, 0.9vw, 0.85rem);
            font-family: 'Space Mono', monospace;
            text-align: center;
            padding: 5px;
        }

        /* 3. LAPTOP DISPLAY: Center Text */
        .overlay-laptop-screen {
            position: absolute;
            top: 53.4%;
            left: 38.2%;
            width: 23.6%;
            height: 27.0%;
            background-color: #040405;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3%;
            text-align: center;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.95);
            border-radius: 3px 3px 0 0;
        }

        .laptop-text {
            font-family: 'Space Mono', monospace;
            font-size: clamp(0.4rem, 0.85vw, 0.85rem);
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: -0.01em;
            color: #ffffff;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            body {
                align-items: center;
            }
            .stage {
                width: 100vw;
                max-height: none; /* Allows natural scaling on mobile aspect ratios */
            }
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- Background Desk Image -->
        <img src="wallpaper2.jpg" alt="Desk Setup" class="bg-image">

        <!-- Left Monitor Screen Overlay -->
        <div class="overlay-left-screen">
            <span class="code-comment">// System Theme Colors</span><br>
            <span class="code-keyword">const</span> styles = {<br>
            &nbsp;&nbsp;<span class="code-prop">theme</span>: {<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">background</span>: <span class="code-string">'#0d0d11'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">surface</span>: <span class="code-string">'#18181f'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">primary</span>: <span class="code-string">'#ff3300'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">textMain</span>: <span class="code-string">'#f8fafc'</span>,<br>
            &nbsp;&nbsp;&nbsp;&nbsp;<span class="code-prop">textMuted</span>: <span class="code-string">'#64748b'</span><br>
            &nbsp;&nbsp;}<br>
            };
        </div>

        <!-- Right Monitor Screen Overlay -->
        <div class="overlay-right-screen">
            <!-- Replace 'your-image.jpg' with your picture path -->
            <img src="your-image.jpg" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="placeholder-note" style="display: none;">
                [ INSERT YOUR IMAGE HERE ]<br>src="your-image.jpg"
            </div>
        </div>

        <!-- Laptop Screen Overlay -->
        <div class="overlay-laptop-screen">
            <div class="laptop-text">
                i am working on this page, its harder than i thought XD
            </div>
        </div>
    </div>

</body>
</html>
