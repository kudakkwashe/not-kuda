<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desk Setup Screen Overlay</title>
  <style>
    /* Reset defaults */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container maintaining aspect ratio */
    .viewport-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
    }

    /* Background image */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    /* Base overlay properties */
    .screen-overlay {
      position: absolute;
      z-index: 2;
      color: #00ffcc;
      font-family: monospace;
      padding: 1%;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
    }

    /* Coordinate percentage mapping */
    .screen-left {
      top: 7.5%;
      left: 9.3%;
      width: 40.2%;
      height: 41.5%;
    }

    .screen-right {
      top: 7.5%;
      left: 49.6%;
      width: 40.2%;
      height: 41.5%;
    }

    .screen-laptop {
      top: 52.8%;
      left: 38.0%;
      width: 23.2%;
      height: 27.8%;
      color: #ffffff;
    }

    /* Fluid typography scaling linked to wrapper width (cqi) */
    .screen-wrapper {
      container-type: inline-size;
    }

    .screen-overlay h2 {
      font-size: 1.8cqi;
      margin-bottom: 0.4cqi;
      border-bottom: 1px solid rgba(0, 255, 204, 0.3);
      padding-bottom: 0.2cqi;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .screen-overlay p, 
    .terminal-line {
      font-size: 1.1cqi;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .screen-laptop p,
    .screen-laptop .terminal-line {
      font-size: 0.85cqi;
    }
  </style>
</head>
<body>

  <div class="viewport-container">
    <div class="screen-wrapper">
      <img src="wallpaper2.jpg" alt="Workspace Setup" class="bg-image">

      <div class="screen-overlay screen-left" id="screenLeft">
        <h2>LEFT MONITOR</h2>
        <p>Main Workspace</p>
        <span class="terminal-line">> System initialized...</span>
        <span class="terminal-line">> Status: 200 OK</span>
      </div>

      <div class="screen-overlay screen-right" id="screenRight">
        <h2>RIGHT MONITOR</h2>
        <p>Documentation</p>
        <span class="terminal-line">[1] CPU: 12% | RAM: 42%</span>
        <span class="terminal-line">[2] Active Connections: 8</span>
      </div>

      <div class="screen-overlay screen-laptop" id="screenLaptop">
        <p>Laptop Screen</p>
        <span class="terminal-line">$ git status</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const laptopScreen = document.getElementById("screenLaptop");
      
      const clockElement = document.createElement("div");
      clockElement.className = "terminal-line";
      clockElement.style.marginTop = "0.4cqi";
      clockElement.style.fontWeight = "bold";
      laptopScreen.appendChild(clockElement);

      function updateClock() {
        const now = new Date();
        clockElement.textContent = "Time: " + now.toLocaleTimeString();
      }

      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>
</body>
</html>
