<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>coming soon</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#eeece5;
    --window:#f7f5ef;
    --ink:#20201d;
    --muted:#87867f;
    --line:#d9d6cb;
    --accent:#2d5f43;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    font-family:'JetBrains Mono', monospace;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    padding:30px;
}

/* subtle paper grain */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    background-image:
        radial-gradient(circle at 20% 20%, #000 1px, transparent 1px),
        radial-gradient(circle at 80% 70%, #000 1px, transparent 1px);
    background-size:28px 28px;
}

.window{
    width:100%;
    max-width:560px;
    background:var(--window);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:
        0 15px 40px rgba(0,0,0,.05),
        0 2px 5px rgba(0,0,0,.03);
    animation:fadeUp .8s ease;
}

.titlebar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    font-size:12px;
    color:var(--muted);
    letter-spacing:.5px;
}

.right{
    display:flex;
    align-items:center;
    gap:8px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--accent);
    animation:pulse 1.3s infinite;
}

.log{
    padding:28px;
}

.line{
    display:flex;
    gap:14px;
    margin-bottom:16px;
    line-height:1.7;
    font-size:14px;
}

.status{
    color:var(--muted);
    flex-shrink:0;
}

.ok{
    color:var(--accent);
}

.note{
    margin-top:28px;
    padding-top:22px;
    border-top:1px solid var(--line);
    color:var(--muted);
    line-height:1.8;
    font-size:13px;
}

.note strong{
    color:var(--ink);
    font-weight:700;
}

.cursor{
    display:inline-block;
    width:8px;
    height:15px;
    background:var(--ink);
    margin-left:3px;
    vertical-align:middle;
    animation:blink .9s steps(1) infinite;
}

.footer{
    margin-top:20px;
    font-size:11px;
    color:#aaa79d;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

@keyframes pulse{
    50%{
        transform:scale(1.4);
        opacity:.6;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:none;
    }
}
</style>
</head>

<body>

<div class="window">

    <div class="titlebar">
        <span>notkuda/build.log</span>

        <div class="right">
            <div class="dot"></div>
            <span>cooking</span>
        </div>
    </div>

    <div class="log">
        <div class="note">
            <strong>coming soon</strong><br><br>

            i'm still working on this page.<br>
            please be patient :')<br><br>

            i'm trying to figure out how to do this thing<br>
            and if its all good ideas XD

            <div class="footer">
                last updated: probably five minutes ago.
            </div>
        </div>

    </div>

</div>

<script>
const text = "making everything actually work...";
const target = document.getElementById("typing");

let i = 0;

function type(){
    if(i < text.length){
        target.textContent += text.charAt(i);
        i++;
        setTimeout(type,55);
    }
}

type();
</script>

</body>
</html>
