<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#070707;
    color:white;
    font-family:'Space Grotesk',sans-serif;
    overflow:hidden;
    height:100vh;
}

#particles{
    position:fixed;
    inset:0;
    z-index:0;
}

.glow{
    position:fixed;
    width:600px;
    height:600px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
    pointer-events:none;
    transform:translate(-50%,-50%);
    transition:.08s linear;
}

.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.box{
    max-width:850px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 18px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:100px;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(10px);
    margin-bottom:40px;
    font-family:"JetBrains Mono";
    font-size:13px;
    letter-spacing:1px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 12px #00ff88;
    animation:pulse 1s infinite;
}

@keyframes pulse{
50%{transform:scale(1.4);}
}

h1{
    font-size:clamp(55px,10vw,120px);
    line-height:.95;
    margin-bottom:30px;
    font-weight:700;
    letter-spacing:-4px;
}

.gradient{
    background:linear-gradient(90deg,#fff,#9c9cff,#66ffe0,#fff);
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradientMove 6s linear infinite;
}

@keyframes gradientMove{
0%{background-position:0%;}
100%{background-position:300%;}
}

p{
    font-size:22px;
    color:#a8a8a8;
    line-height:1.8;
    margin-bottom:50px;
}

.typing{
    color:white;
    border-right:2px solid white;
    display:inline-block;
    white-space:nowrap;
    overflow:hidden;
    animation:blink .8s infinite;
}

@keyframes blink{
50%{
border-color:transparent;
}
}

.footer{
    font-family:"JetBrains Mono";
    color:#666;
    font-size:13px;
    letter-spacing:1px;
    margin-top:20px;
}

.footer span{
    color:white;
}

.code{
    display:inline-block;
    padding:15px 20px;
    background:#111;
    border-radius:12px;
    font-family:"JetBrains Mono";
    color:#9cffc8;
    margin-top:30px;
    border:1px solid rgba(255,255,255,.08);
}

.fade{
    animation:float 5s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="glow"></div>

<div class="container">

<div class="box fade">

<div class="status">
<div class="dot"></div>
BUILD IN PROGRESS
</div>

<h1 class="gradient">
COMING<br>SOON.
</h1>

<p>
<span class="typing"></span>
</p>

<div class="code">
&gt; compiling cool ideas...
</div>

<div class="footer">
made with questionable decisions & caffeine ☕
</div>

</div>

</div>

<script>
const message="i'm working on it... pls be patient 😭 i'm also learning XDDD";

let i=0;
const typing=document.querySelector(".typing");

function type(){
    if(i<message.length){
        typing.innerHTML+=message.charAt(i);
        i++;
        setTimeout(type,55);
    }
}
type();

const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<120;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2,
        dx:(Math.random()-.5)*.4,
        dy:(Math.random()-.5)*.4
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p=>{
        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0)p.x=canvas.width;
        if(p.x>canvas.width)p.x=0;
        if(p.y<0)p.y=canvas.height;
        if(p.y>canvas.height)p.y=0;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,.55)";
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

window.onresize=()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
};

const glow=document.querySelector(".glow");

window.addEventListener("mousemove",e=>{
    glow.style.left=e.clientX+"px";
    glow.style.top=e.clientY+"px";
});
</script>

</body>
</html>
